[package]
name = "cosmic-osd"
version = "1.2.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3.32"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-comp-config = { git = "https://github.com/pop-os/cosmic-comp" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "dbus-config",
    "desktop-systemd-scope",
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    "single-instance",
] }
log = "0.4.29"
logind-zbus = "5.3.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["process", "macros"] }
tokio-stream = "0.1.18"
uzers = "0.12.2"
xdg = "3.0"
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
kdl = "6"
cosmic-randr-shell = { git = "https://github.com/pop-os/cosmic-randr", default-features = false }

[dependencies.cosmic-settings-airplane-mode-subscription]
git = "https://github.com/pop-os/cosmic-settings"

[dependencies.cosmic-settings-audio-client]
git = "https://github.com/pop-os/cosmic-settings-daemon"
features = ["codec"]

[dependencies.cosmic-settings-upower-subscription]
git = "https://github.com/pop-os/cosmic-settings"

[dependencies.cosmic-settings-daemon-subscription]
git = "https://github.com/pop-os/cosmic-settings"

# Build against the Playtron libcosmic fork.
#
# `fix/theme-seed-8cb10bf` is upstream 8cb10bf (the base this crate's surface
# APIs require) plus the per-mode theme-seed fix. Without it, `system_light()`
# loads the light config on top of `Theme::default()` == `preferred_theme()`,
# which is dark on any desktop whose XDG_CURRENT_DESKTOP lacks "gnome"
# (HUMAIN:COSMIC). With no `/usr/share/cosmic/com.system76.CosmicTheme.Light`
# layer installed, every colour key is absent, so light mode renders the dark
# palette — the polkit dialog and the OSD come up dark on a light desktop.
#
# The fork's `master` cannot be used here: its base predates the surface
# rewrite and has no `cosmic::surface::{surface_task, action::*}`.
#
# Every crate from this source must be listed. Patching only some leaves the
# rest on pop-os and links two incompatible copies of `iced_core`.
[patch.'https://github.com/pop-os/libcosmic']
libcosmic = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
cosmic-config = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
cosmic-config-derive = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
cosmic-theme = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_accessibility = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_core = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_debug = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_futures = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_graphics = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_program = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_renderer = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_runtime = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_tiny_skia = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_wgpu = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_widget = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }
iced_winit = { git = "https://github.com/playtron-os/libcosmic.git", branch = "fix/theme-seed-8cb10bf" }

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
