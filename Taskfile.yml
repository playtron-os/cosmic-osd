version: "3"

vars:
  NAME:
    sh: grep 'name =' Cargo.toml | head -n 1 | cut -d'"' -f2
  VERSION:
    sh: grep '^version =' Cargo.toml | head -n 1 | cut -d'"' -f2
  HOST_OS:
    sh: uname
  HOST_ARCH:
    sh: uname -m
  TARGET_ARCH:
    sh: "rustc -vV | sed -n 's/host: //p'"
  ARCH:
    sh: echo "{{.TARGET_ARCH}}" | cut -d'-' -f1
  IMAGE_NAME: "{{.NAME}}-builder"
  IMAGE_TAG:
    sh: sha256sum Dockerfile | cut -d' ' -f1
  # Directory name of this checkout. The remote copy keeps the same name.
  PROJECT:
    sh: basename "$PWD"
  PREFIX: '{{.PREFIX | default "/usr"}}'
  DESTDIR: '{{.DESTDIR | default ""}}'
  # Everything the device does not need, and must not have deleted out from
  # under it: `target` is the remote build cache, `.cache` is the container
  # build's cargo home.
  RSYNC_EXCLUDES: >-
    --exclude=.git --exclude=target --exclude=.cache --exclude=dist
    --exclude=builder --exclude=node_modules

tasks:
  default:
    aliases:
      - help
    cmds:
      - go-task --list

  build:debug:
    desc: Build debug build
    cmds:
      - cargo build {{.ARG | default ""}} --target {{.TARGET_ARCH}}

  build:release:
    desc: Build release build
    aliases:
      - build
    cmds:
      - cargo build --release --target {{.TARGET_ARCH}}

  build:all:
    desc: Build release and debug builds
    deps:
      - build:debug
      - build:release

  run:
    deps:
      - build:debug
    requires:
      vars:
        - name: LOG_LEVEL
          enum: [trace, debug, info]
    vars:
      LOG_LEVEL: '{{.LOG_LEVEL | default "info"}}'
    env:
      RUST_LOG: |-
        {{- if eq .LOG_LEVEL "trace" }}
        error,cosmic_osd=trace
        {{- else if eq .LOG_LEVEL "debug" }}
        error,cosmic_osd=debug
        {{- else }}
        error,cosmic_osd=info
        {{- end }}
    cmds:
      - ./target/{{.TARGET_ARCH}}/debug/{{.NAME}}

  install:
    desc: Install the debug build locally
    deps:
      - build:debug
    cmds:
      - sudo install -D -m 755 ./target/{{.TARGET_ARCH}}/debug/{{.NAME}}
        {{.DESTDIR}}{{.PREFIX}}/bin/{{.NAME}}
      # restorecon, because a file installed from a user checkout inherits
      # user_home_t and the session then cannot exec it under enforcing SELinux.
      - sudo restorecon {{.DESTDIR}}{{.PREFIX}}/bin/{{.NAME}} 2>/dev/null || true
      - echo "Installed {{.NAME}} to {{.DESTDIR}}{{.PREFIX}}/bin"

  deploy:native:
    desc: >-
      Rsync this checkout to a device, build it natively there, and install the
      debug build. E.g. go-task deploy:native HOST=playtron@192.168.1.115
    aliases:
      - deploy:device
    requires:
      vars:
        - name: HOST
    vars:
      # Parent of the remote checkout.
      REMOTE_ROOT: '{{.REMOTE_ROOT | default "~/src"}}'
      REMOTE_DIR: "{{.REMOTE_ROOT}}/{{.PROJECT}}"
    preconditions:
      - sh: which rsync
        msg: "Prerequisite utility 'rsync' is not installed"
      - sh: ssh -o BatchMode=yes -o ConnectTimeout=10 {{.HOST}} true
        msg: "Cannot reach {{.HOST}} over SSH without a password. Set up key auth first."
      - sh: ssh {{.HOST}} 'command -v cargo'
        msg: >-
          No cargo on {{.HOST}}. This target builds natively on the device, so it
          needs a Rust toolchain and the usual -devel packages there.
      - sh: ssh {{.HOST}} 'command -v go-task || command -v task'
        msg: "No go-task on {{.HOST}}; it runs the build and install steps there."
      # /usr is read-only on a bootc image until it is overlaid, and the install
      # step writes into {{.PREFIX}}/bin.
      - sh: ssh {{.HOST}} 'findmnt -no OPTIONS {{.PREFIX}} | grep -q "^rw"'
        msg: >-
          {{.PREFIX}} is read-only on {{.HOST}}. Run `sudo bootc usr-overlay` there
          first — it is transient, so it has to be redone after every reboot.
    cmds:
      - echo "Syncing {{.PROJECT}} to {{.HOST}}:{{.REMOTE_DIR}}"
      - ssh {{.HOST}} 'mkdir -p {{.REMOTE_ROOT}}'
      # --delete keeps the remote tree honest about removals; the excludes above
      # are protected from it, so the remote `target` cache survives.
      - rsync -az --delete {{.RSYNC_EXCLUDES}} ./ {{.HOST}}:{{.REMOTE_DIR}}/
      - echo "Building and installing on {{.HOST}} (first run compiles from scratch)"
      # -t so the remote `sudo install` can prompt. Every dependency is a public
      # https git URL, so no agent forwarding is needed for the fetch.
      - ssh -t {{.HOST}} 'cd {{.REMOTE_DIR}} &&
        $(command -v go-task || command -v task) install'
      # cosmic-session supervises the OSD (SESSION_COMPONENTS), so dropping the
      # old process is how the new binary gets picked up.
      - cmd: ssh {{.HOST}} 'pkill -x {{.NAME}} || true'
        ignore_error: true
      - echo "Done. {{.NAME}} installed on {{.HOST}}; the session should respawn it."

  dist:prepare:
    desc: Prepare the project for packaging
    deps:
      - build:release
    cmds:
      - rm -rf .cache/{{.NAME}}
      - mkdir -p .cache/{{.NAME}}/usr/bin
      - install -Dm0755 "target/{{.TARGET_ARCH}}/release/{{.NAME}}" ".cache/{{.NAME}}/usr/bin/{{.NAME}}"
      - install -Dm0644 "LICENSE" ".cache/{{.NAME}}/usr/share/licenses/{{.NAME}}/LICENSE"
      - mkdir -p dist

  dist:archive:
    desc: Build a tar archive of the project
    deps:
      - dist:prepare
    cmds:
      - tar cvfz dist/{{.NAME}}-{{.ARCH}}.tar.gz -C .cache {{.NAME}}

  dist:rpm:
    desc: Build an RPM package
    aliases:
      - rpm
    deps:
      - dist:archive
    preconditions:
      - sh: which rpmbuild
        msg: "Prerequisite utility 'rpmbuild' is not installed"
    cmds:
      - mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
      - cp ./pkg/rpm/{{.NAME}}.spec ~/rpmbuild/SPECS
      - cp dist/{{.NAME}}-{{.ARCH}}.tar.gz ~/rpmbuild/SOURCES
      - rpmbuild -bb --target {{.ARCH}} ~/rpmbuild/SPECS/{{.NAME}}.spec
      # glob the release field so a local Fedora build (dist tag, e.g. .fc44) is
      # matched as well as the tagless Debian/CI container build.
      - cp ~/rpmbuild/RPMS/{{.ARCH}}/{{.NAME}}-{{.VERSION}}-1*.{{.ARCH}}.rpm dist

  dist:all:
    desc: Build all supported distributable packages
    aliases:
      - dist
    cmds:
      - task: dist:archive
      - task: dist:rpm

  release:
    desc: Publish a new release
    preconditions:
      - sh: which npx
        msg: "Prerequisite utility 'npx' is not installed"
    cmds:
      # The .releaserc.yaml config contains the build commands and publish config
      - npx semantic-release

  repo:update:
    desc: "Upload the release to the package repository"
    vars:
      BUCKET: playtron-dev2-global-os-public
      BUCKET_PATH: repos/playtron-app/{{.ARCH}}
      FILE: "dist/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm"
      REPO_NAME: playtron
    preconditions:
      - sh: ls {{.FILE}}
        msg: "File to upload does not exist: {{.FILE}}"
      - sh: env | grep -q '^PACKAGES_UPLOAD_TOKEN='
        msg: "PACKAGES_UPLOAD_TOKEN environment variable is not set"
    cmds:
      # TODO: Remove S3 uploads after repository switch
      - echo "Uploading {{.FILE}} to s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename {{.FILE}})"
      - aws s3 cp {{.FILE}} s3://{{.BUCKET}}/{{.BUCKET_PATH}}/$(basename "{{.FILE}}")
      - echo "Publishing {{.FILE}} to 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"
      - "curl -H 'Authorization: Bearer {{.PACKAGES_UPLOAD_TOKEN}}' -T {{.FILE}} 'https://packages.playtron.one/rpm/{{.REPO_NAME}}/packages/{{.NAME}}-{{.VERSION}}-1.{{.ARCH}}.rpm'"

  test:all:
    desc: Run all tests
    aliases:
      - test
    cmds:
      - cargo test -- --show-output

  test:one:
    desc: Run a single test - E.g. go-task test:one TEST=<test>
    requires:
      vars:
        - TEST
    cmds:
      - RUST_BACKTRACE=1 cargo test {{.TEST}} -- --exact --show-output --include-ignored

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf target .cache dist builder

  docker:build:
    desc: Build the container image used for the `docker:run` target
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    status:
      - docker images | grep {{.IMAGE_NAME}} | grep {{.IMAGE_TAG}}
    cmds:
      - docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} .

  docker:run:
    desc: Run tasks inside Docker. E.g. go-task docker:run TARGET=build TARGET_ARCH=x86_64-unknown-linux-gnu
    aliases:
      - in-docker
    deps:
      - docker:build
    preconditions:
      - sh: which docker
        msg: "Prerequisite utility 'docker' is not installed"
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g
      PWD:
        sh: pwd
      SSH_KEY:
        sh: echo "${SSH_KEY}"
    requires:
      vars:
        - TARGET
    cmds:
      - mkdir -p .cache/home
      - mkdir -p .cache/var/lib/rpm
      # A /etc/passwd entry is required so the correct ~/.ssh path is used
      - echo -e "build:x:{{.UID}}:{{.GID}}::/home/build:/bin/bash" > .cache/passwd
      # Use the SSH key from the host
      - |
        mkdir -p .cache/.ssh
        {{ if ne .SSH_KEY "" }}
          echo "{{.SSH_KEY}}" > .cache/.ssh/id_ed25519
          chmod 600 .cache/.ssh/id_ed25519
        {{ else }}
          cp ~/.ssh/* .cache/.ssh
        {{ end }}
      - |
        docker run --rm \
          -v "{{.PWD}}:{{.PWD}}" \
          -v "{{.PWD}}/.cache/home:/home/build" \
          -v "{{.PWD}}/.cache/var/lib/rpm:/var/lib/rpm" \
          -v "{{.PWD}}/.cache/.ssh:/home/build/.ssh" \
          -v "{{.PWD}}/.cache/passwd:/etc/passwd" \
          --workdir "{{.PWD}}" \
          -e HOME=/home/build \
          -e CARGO_HOME=/home/build/.cargo \
          -e BUILD_TYPE=${BUILD_TYPE} \
          -e PKG_CONFIG_SYSROOT_DIR="/usr/{{.ARCH}}-linux-gnu" \
          -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
          -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
          --user {{.UID}}:{{.GID}} \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          task {{.TARGET}} ARCH={{.ARCH}} TARGET_ARCH={{.TARGET_ARCH}}
